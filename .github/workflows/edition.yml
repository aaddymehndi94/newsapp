# Produces, builds and deploys each edition on GitHub's servers (no laptop needed).
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY     — Anthropic API key
#   CLOUDFLARE_API_TOKEN  — Cloudflare token from the "Edit Cloudflare Workers" template
# Free test: Actions → Edition → Run workflow with "test only" ticked checks both secrets and
# redeploys the site from the editions already in the repo, without writing a new edition.
name: Edition

on:
  schedule:
    # One edition a day (owner's choice, 2026-11-24, to keep costs down), made only here: the
    # owner turned the laptop fallback off on 2026-11-25. GitHub can start scheduled jobs late
    # (6h44m on 2026-11-25, about 6h on 26 and 27 Nov), so there are three start times; the first
    # to run makes the edition and the others find it in the repo and stop before any paid step.
    # A Cloudflare timer (timer/) also starts the run at 03:37 IST once it has a GitHub token.
    - cron: "7 22 * * *"    # 03:37 IST
    - cron: "47 22 * * *"   # 04:17 IST
    - cron: "27 23 * * *"   # 04:57 IST
  # Re-make today's edition by pushing a change to this file (used when a fix must reach today's
  # edition after the scheduled run; it costs a second edition). Pushes by the edition bot itself
  # never trigger workflows, and only a change to this exact file does.
  push:
    branches: [main]
    paths: [".github/remake-edition"]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test only: check the secrets and redeploy the current site (no new edition, no API cost)"
        type: boolean
        default: false
      slot:
        description: "am or pm (blank = by current IST time)"
        required: false

concurrency: edition

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # half-price batches can be slow; waiting is cheaper than re-running
    permissions:
      contents: write
    steps:
      - name: Check secrets
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          C: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          G: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          [ -n "$G" ] || echo "::warning::No GUARDIAN_API_KEY secret: the Guardian is read from RSS"
          [ -n "$A" ] || { echo "::error::Add the ANTHROPIC_API_KEY repo secret"; exit 1; }
          [ -n "$C" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN repo secret"; exit 1; }
          # Listing models is free and proves the Anthropic key works.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models -H "x-api-key: $A" -H "anthropic-version: 2023-06-01")
          [ "$code" = "200" ] || { echo "::error::ANTHROPIC_API_KEY was refused (HTTP $code)"; exit 1; }
      - uses: actions/checkout@v4
      # Never pay for a second edition in a day. A queued run's checkout can predate the run that
      # just finished, so look at the branch as it is now, not at the checkout. Starts from the
      # Cloudflare timer (timer/, workflow_dispatch) skip too; only a push of
      # .github/remake-edition re-makes an edition that exists.
      - name: Skip if today's edition already exists
        id: done
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.test_only) }}
        run: |
          today="$(TZ=Asia/Kolkata date +%F)"
          git fetch -q --depth=1 origin main
          if git ls-tree --name-only origin/main data/editions/ | grep -q "/$today-"; then
            echo "::notice::Today's edition ($today) is already in the repo; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: ${{ steps.done.outputs.skip != 'true' }}
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: ${{ steps.done.outputs.skip != 'true' }}
      - name: Produce edition
        if: ${{ !inputs.test_only && steps.done.outputs.skip != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: YouTube Data API key (free, Google Cloud). Turns on story videos and finds
          # trailers Wikidata doesn't list. Without it there are no story videos.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Optional: TMDB key for film listings with TMDB's popularity instead of Wikipedia's.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # The Guardian's Content API (free developer key): full text of its reports. Without it
          # the Guardian is read from its RSS feeds.
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          # Lifts GitHub's API rate limit for the "New on GitHub" list.
          GITHUB_TOKEN: ${{ github.token }}
          TZ: Asia/Kolkata
        run: node pipeline/run.ts --fresh --batch --no-deploy ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
      - name: Build the site from the editions in the repo
        if: ${{ inputs.test_only }}
        run: node site/build.ts --data data/editions --out dist
      - name: Deploy
        if: ${{ steps.done.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Save edition to the repo
        if: ${{ !inputs.test_only && steps.done.outputs.skip != 'true' }}
        run: |
          git config user.name "meridian-bot"
          git config user.email "meridian-bot@users.noreply.github.com"
          git add data/editions data/markets
          git commit -m "Edition $(TZ=Asia/Kolkata date +%F-%H%M)" || exit 0
          git pull --rebase --autostash origin main
          git push
      # Sundays: run the editor a second time on the same menu and record how far the two choices
      # agree (docs/superpowers/specs/2026-11-26-selection-design.md). About $0.25; never fails the run.
      - name: Weekly consistency check
        if: ${{ !inputs.test_only && steps.done.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          [ "$(date +%u)" = 7 ] || exit 0
          ed=$(ls data/work | grep "^$(date +%F)-" | head -1)
          [ -n "$ed" ] || exit 0
          node pipeline/consistency.ts --edition "$ed" --batch
          git add data/consistency
          git commit -m "Consistency check $ed" || exit 0
          git pull --rebase --autostash origin main
          git push
